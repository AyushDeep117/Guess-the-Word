<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Guess The Word</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="auth-page">

    <form method="POST">

    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
        >

    </div>


    <div class="password-hint">

        Password must contain:

        <ul>
            <li>At least 5 characters</li>
            <li>At least one letter</li>
            <li>At least one number</li>
            <li>One of $, % or *</li>
        </ul>

    </div>


    <button
        type="submit"
        class="button button-primary large-button"
    >
        Create Account
    </button>

</form>


<p class="auth-footer">

    Already have an account?

    <a href="{{ url_for('auth.login') }}">
        Login
    </a>

</p>

</body>
</html>
